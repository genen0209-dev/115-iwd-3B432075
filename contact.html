<main>

    <section class="registration">

        <h2>聯絡我</h2>
        <head>
            <link rel="stylesheet" href="style.css">
        </head>
        <p>歡迎填寫以下表單與我聯絡。</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="請輸入您的姓名"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@email.com"
                       required>
            </div>

            <div class="form-group">
                <label for="session">報名場次</label>

                <select id="session" name="session">
                    <option value="">請選擇報名場次</option>
                    <option value="morning">上午場 09:00 - 12:00</option>
                    <option value="afternoon">下午場 13:00 - 16:00</option>
                    <option value="evening">晚間場 18:00 - 21:00</option>
                </select>
            </div>

            <button type="submit">送出報名</button>

        </form>

    </section>

</main>
